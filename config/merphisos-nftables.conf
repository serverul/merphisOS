#!/usr/sbin/nft -f
# MerphisOS - nftables firewall rules
# Deny inbound, allow outbound, protect against common attacks

flush ruleset

# === TABLES ===
table inet filter {
    # === CHAINS ===
    chain input {
        type filter hook input priority 0; policy drop;

        # Loopback
        iif lo accept

        # Stare: conexiuni existente OK
        ct state established,related accept

        # Invalid packets
        ct state invalid drop

        # ICMP (ping) limitat
        ip protocol icmp limit rate 10/second accept
        ip6 nexthdr icmpv6 limit rate 10/second accept

        # SSH (port 22) - doar din rețeaua locală
        tcp dport 22 ip saddr 192.168.0.0/16 accept
        tcp dport 22 ip saddr 10.0.0.0/8 accept
        tcp dport 22 ip saddr 172.16.0.0/12 accept
        tcp dport 22 drop

        # mDNS (avahi) - doar local
        udp dport mdns accept

        # DHCP
        udp dport 67-68 accept

        # Totul altceva e drop (policy)
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

# === LOGGING (doar drop-uri) ===
table inet log {
    chain logdrop {
        log prefix "NFT-DROP: " level info group 0
    }
}
