# MerphisOS - LibreWolf system-wide telemetry disable
# This overrides default LibreWolf preferences for ALL users
# Placed in /etc/librewolf/overrides.cfg

// System-wide LibreWolf configuration
lockPref("app.normandy.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("browser.laterrun.enabled", false);
lockPref("browser.newtabpage.activity-stream.asrouter.providers.snippets", false);
lockPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);
lockPref("browser.newtabpage.activity-stream.feeds.telemetry", false);
lockPref("browser.newtabpage.activity-stream.telemetry", false);
lockPref("browser.ping-centre.telemetry", false);
lockPref("browser.readinglist.update", false);
lockPref("browser.safebrowsing.downloads.enabled", false);
lockPref("browser.safebrowsing.malware.enabled", false);
lockPref("browser.safebrowsing.phishing.enabled", false);
lockPref("browser.selfsupport.url", "");
lockPref("browser.tabs.crashReporting.sendReport", false);
lockPref("browser.urlbar.quicksuggest.enabled", false);
lockPref("browser.urlbar.suggest.searches", false);
lockPref("browser.urlbar.tipShownCount", 0);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("datareporting.policy.dataSubmissionEnabled", false);
lockPref("datareporting.sessions.current.clean", true);
lockPref("devtools.onboarding.telemetry.logged", true);
lockPref("dom.push.enabled", false);
lockPref("extensions.pocket.enabled", false);
lockPref("media.video_stats.enabled", false);
lockPref("network.allow-experiments", false);
lockPref("network.trr.mode", 2);
lockPref("network.trr.uri", "https://dns.quad9.net/dns-query");
lockPref("privacy.trackingprotection.enabled", true);
lockPref("toolkit.telemetry.archive.enabled", false);
lockPref("toolkit.telemetry.bhrPing.enabled", false);
lockPref("toolkit.telemetry.cachedClientID", "");
lockPref("toolkit.telemetry.enabled", false);
lockPref("toolkit.telemetry.firstShutdownPing.enabled", false);
lockPref("toolkit.telemetry.hybridContent.enabled", false);
lockPref("toolkit.telemetry.newProfilePing.enabled", false);
lockPref("toolkit.telemetry.prompted", 2);
lockPref("toolkit.telemetry.rejected", true);
lockPref("toolkit.telemetry.server", "");
lockPref("toolkit.telemetry.shutdownPingSender.enabled", false);
lockPref("toolkit.telemetry.unified", false);
lockPref("toolkit.telemetry.updatePing.enabled", false);
