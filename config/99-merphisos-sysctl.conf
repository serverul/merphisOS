# MerphisOS - Kernel Hardening (sysctl)
# Aplicate la boot pentru securitate maximă

# --- Network Hardening ---
# Fără IP forwarding (nu suntem router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Fără redirect ICMP
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.all.secure_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0

# Fără source routing
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Ignoră broadcast ICMP
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Protecție împotriva syn flood
net.ipv4.tcp_syncookies = 1

# Reverse path filtering (protecție IP spoofing)
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1

# Ignoră pings
net.ipv4.icmp_echo_ignore_all = 0  # lasă ping-ul să funcționeze

# Blackhole martian packets
net.ipv4.conf.all.log_martians = 1

# --- Kernel Hardening ---
# ASLR maxim
kernel.randomize_va_space = 2

# Restricționează accesul la dmesg
kernel.dmesg_restrict = 1

# Restricționează accesul la kptr
kernel.kptr_restrict = 2

# Oops panic (mai sigur)
kernel.panic_on_oops = 1

# Protecție execshield
kernel.exec-shield = 1

# Fără BPF JIT (protecție Spectre)
net.core.bpf_jit_enable = 0

# Hardened memory
vm.mmap_min_addr = 65536

# Restricționează ptrace
kernel.yama.ptrace_scope = 1

# Fără module de kernel necredibile
kernel.modules_disabled = 0  # păstrăm modulele dar le semnăm

# Timeout panic
kernel.panic = 10
