# MerphisOS Calamares - Unpackfs configuration
# This tells Calamares which files/directories to copy from live to target
# We use "unsquashfs" operation which extracts the squashfs filesystem
# to the target root partition

unpack:
    - source: "/run/live/medium/live/filesystem.squashfs"
      sourcefs: "squashfs"
      destination: ""
      # Exclude directories that are live-specific
      exclude:
          - "/home/live/.cache"
          - "/home/live/.config/autostart/hybrido-first-run.desktop"
          - "/tmp/*"
          - "/var/cache/*"
          - "/var/log/*"
      # Mountpoints to create after unpacking
      mountpoints:
          - "/proc"
          - "/sys"
          - "/dev"
