# MerphisOS Calamares - Users module
# Creates the user account during installation
# Default: user chooses their own username

userGroup:
    - "sudo"
    - "audio"
    - "video"
    - "cdrom"
    - "plugdev"
    - "netdev"
    - "docker"
    - "libvirt"

# Don't set a default username - let user choose
defaultGroups: []
setRootPassword: true
doReusePassword: true

# Password requirements
passwordRequirements:
    minLength: 6
    maxLength: 0  # no max
    allowWeakPasswords: true  # for testing
