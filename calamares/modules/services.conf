# MerphisOS Calamares - Services module
# Enable/disable system services after installation

services:
    enabled:
        - "NetworkManager"
        - "sddm"
        - "systemd-resolved"
        - "systemd-timesyncd"
        - "nftables"
        - "apparmor"
    disabled:
        - "bluetooth"  # enable only if hardware detected

# Default target
setDefaultRunlevel: graphical.target
